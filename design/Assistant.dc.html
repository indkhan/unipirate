<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="./styles.css">
  <style>
    body { margin: 0; background: #F2F4F7; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>

<div style="min-height: 100vh; background: var(--paper); color: var(--ink); font-family: var(--font-body); display: flex; flex-direction: column; align-items: center;">
  <div style="width: 100%; max-width: 460px; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--line); border-right: 1px solid var(--line);">

    <!-- HEADER -->
    <header data-screen-label="Assistant header" style="position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <a href="Dashboard.dc.html" style="color: var(--route-blue); text-decoration: none; font-size: 15px; font-weight: 500; padding: 8px 8px 8px 0;">‹</a>
        <div style="display: flex; flex-direction: column;">
          <span style="font-family: var(--font-display); font-weight: 700; font-size: 16px;">Ask Uniweg</span>
          <span style="font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-muted);">Answers only with sources</span>
        </div>
      </div>
      <span style="font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted);" title="Daily question quota">{{ quota }}</span>
    </header>

    <!-- MESSAGES -->
    <main style="flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto;">

      <!-- EMPTY STATE: suggested questions -->
      <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
        <div data-screen-label="Assistant empty" style="display: flex; flex-direction: column; gap: 14px; padding-top: 24px;">
          <span style="width: 18px; height: 18px; border-radius: 999px; border: 2.5px solid var(--line-strong); box-sizing: border-box; align-self: center;"></span>
          <p style="margin: 0; font: var(--text-body-sm); color: var(--ink-secondary); text-align: center; max-width: 36ch; align-self: center;">Ask about your route. Every answer cites an official source — and when we can't confirm something, we say so.</p>
          <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
            <sc-for list="{{ suggestions }}" as="s" hint-placeholder-count="3">
              <button onClick="{{ s.ask }}" style="min-height: 48px; text-align: left; padding: 12px 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; font-family: var(--font-body); font-size: 14.5px; color: var(--route-blue); cursor: pointer;">{{ s.text }}</button>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ hasMessages }}" hint-placeholder-val="{{ true }}">
        <sc-for list="{{ messages }}" as="m" hint-placeholder-count="4">

          <!-- user bubble -->
          <sc-if value="{{ m.isUser }}" hint-placeholder-val="{{ false }}">
            <div style="align-self: flex-end; max-width: 85%; background: var(--route-blue); color: var(--ink-inverse); border-radius: 10px 10px 2px 10px; padding: 10px 14px; font: var(--text-body-sm); font-size: 15px;">{{ m.text }}</div>
          </sc-if>

          <!-- assistant answer -->
          <sc-if value="{{ m.isBot }}" hint-placeholder-val="{{ true }}">
            <div style="align-self: flex-start; max-width: 94%; display: flex; flex-direction: column; gap: 8px;">
              <div style="background: var(--paper); border: 1px solid var(--line); border-radius: 10px 10px 10px 2px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;">
                <span style="font: var(--text-body-sm); font-size: 15px; color: var(--ink); white-space: pre-line;">{{ m.text }}</span>

                <!-- verified citation -->
                <sc-if value="{{ m.hasStamp }}" hint-placeholder-val="{{ false }}">
                  <div>
                    <x-import component="VerifiedStamp" from="./components/verification/VerifiedStamp.jsx" source="{{ m.source }}" date="{{ m.sourceDate }}" hint-size="260px,28px"></x-import>
                  </div>
                </sc-if>

                <!-- unverified web chip -->
                <sc-if value="{{ m.isWeb }}" hint-placeholder-val="{{ false }}">
                  <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px; background: var(--signal-tint); border: 1px solid rgba(154,98,0,0.35); border-radius: 6px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--signal);"><span style="width: 8px; height: 8px; background: var(--signal-accent); border-radius: 1px;"></span>Unverified — double-check</span>
                </sc-if>

                <!-- designed "I don't know" -->
                <sc-if value="{{ m.isUnknown }}" hint-placeholder-val="{{ false }}">
                  <div style="border-top: 1px dashed var(--line-strong); padding-top: 10px; display: flex; flex-direction: column; gap: 6px;">
                    <span style="font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-secondary);">Not in our verified rules</span>
                    <span style="font: var(--text-body-sm); color: var(--ink-secondary);">{{ m.unknownNote }}</span>
                    <a href="#" style="font: var(--text-body-sm); font-weight: 500; color: var(--route-blue); text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px;">{{ m.unknownLink }}</a>
                  </div>
                </sc-if>
              </div>
              <button style="align-self: flex-start; border: none; background: transparent; padding: 2px 4px; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-muted); cursor: pointer;">Report this answer</button>
            </div>
          </sc-if>
        </sc-for>
      </sc-if>
    </main>

    <!-- COMPOSER -->
    <footer data-screen-label="Composer" style="position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 8px;">
      <input placeholder="Ask about your route…" value="{{ draft }}" onChange="{{ onDraft }}" onKeyDown="{{ onKey }}" style="flex: 1; min-width: 0; font-family: var(--font-body); font-size: 16px; color: var(--ink); background: var(--paper); border: 1px solid var(--line-strong); border-radius: 6px; min-height: 48px; padding: 0 14px;" />
      <x-import component="Button" from="./components/actions/Button.jsx" on-click="{{ send }}" hint-size="80px,48px">Send</x-import>
    </footer>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;demoState&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;conversation&quot;, &quot;empty&quot;], &quot;default&quot;: &quot;conversation&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Demo&quot; }
}">
class Component extends DCLogic {
  state = {
    draft: '',
    asked: 6,
    messages: [
      { role: 'user', text: "What's my next APS step?" },
      { role: 'bot', text: 'Your APS payment is recorded. The next step is uploading the payment receipt to the APS portal — it is due 08 Jul 2026 and unlocks your appointment booking.', source: 'aps-india.de checklist', sourceDate: '21 Jun 2026' },
      { role: 'user', text: 'Can I use a friend\u2019s blocked account statement as proof?' },
      { role: 'bot', kind: 'unknown', text: 'We can\u2019t confirm this. Our verified rules cover the standard blocked account requirement (\u20ac11,904 in your own name), but say nothing about third-party statements.',
        unknownNote: 'The embassy decides case by case here. Check the official financial-proof page before your appointment:',
        unknownLink: 'German missions \u2014 proof of financial resources' },
      { role: 'user', text: 'Is the TU Berlin dorm waiting list long?' },
      { role: 'bot', kind: 'web', text: 'Recent forum posts mention waits of 2\u20134 semesters for studierendenWERK Berlin dorms. This comes from the web, not from our verified rules \u2014 treat it as a rumour until the provider confirms it.' },
    ],
  };

  seedLen = 6;

  cannedAnswer(text) {
    const canned = {
      "What's my next APS step?": { role: 'bot', text: 'Your APS payment is recorded. The next step is uploading the payment receipt to the APS portal — it is due 08 Jul 2026 and unlocks your appointment booking.', source: 'aps-india.de checklist', sourceDate: '21 Jun 2026' },
      'Which documents are missing for TU Berlin?': { role: 'bot', text: 'Two documents are still open for your TU Berlin application: the certified translation of your Class 12 transcript, and your IELTS certificate. Everything else on the uni-assist checklist is uploaded.', source: 'uni-assist document checklist', sourceDate: '28 Jun 2026' },
      'When should I open my blocked account?': { role: 'bot', text: 'Open it right after your admission letter arrives, and no later than 8 weeks before your visa appointment — the confirmation letter takes up to 2 weeks and the embassy requires it at the appointment.', source: 'auswaertiges-amt.de — student visa', sourceDate: '28 Jun 2026' },
    };
    return canned[text];
  }

  ask(text) {
    const answer = this.cannedAnswer(text) || {
      role: 'bot', kind: 'unknown', text: 'This is a design prototype \u2014 the assistant is not connected yet.',
      unknownNote: 'In the real product this answer would cite a verified rule or say what it cannot confirm.',
      unknownLink: 'See how verified answers look',
    };
    this.setState((s) => ({
      draft: '',
      asked: Math.min(20, s.asked + 1),
      messages: [...s.messages, { role: 'user', text }, answer],
    }));
  }

  renderVals() {
    const mode = this.props.demoState ?? 'conversation';
    const msgs = mode === 'empty' ? this.state.messages.slice(this.seedLen) : this.state.messages;

    return {
      quota: this.state.asked + '/20 today',
      isEmpty: msgs.length === 0,
      hasMessages: msgs.length > 0,
      suggestions: [
        "What's my next APS step?",
        'Which documents are missing for TU Berlin?',
        'When should I open my blocked account?',
      ].map((text) => ({
        text,
        ask: () => this.ask(text),
      })),
      messages: msgs.map((m) => ({
        isUser: m.role === 'user',
        isBot: m.role === 'bot',
        text: m.text,
        hasStamp: !!m.source,
        source: m.source || '',
        sourceDate: m.sourceDate || '',
        isWeb: m.kind === 'web',
        isUnknown: m.kind === 'unknown',
        unknownNote: m.unknownNote || '',
        unknownLink: m.unknownLink || '',
      })),
      draft: this.state.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') this.sendDraft(); },
      send: () => this.sendDraft(),
    };
  }

  sendDraft() {
    const text = this.state.draft.trim();
    if (!text) return;
    this.ask(text);
  }
}
</script>
</body>
</html>
